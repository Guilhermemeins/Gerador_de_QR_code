
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gerador de QR Code</title>
</head>
<body>

    <main>
        <h1>Gerador de QR Code</h1>

        <form id="formulario">
            <label for="link">
                Digite seu link ou texto:
            </label>

            <input
                type="text"
                id="link"
                placeholder="https://exemplo.com"
                required
            >

            <button type="submit">
                Gerar QR Code
            </button>
        </form>

        <section id="resultado" hidden>
            <h2>Seu QR Code</h2>

            <div id="qrcode"></div>

            <button type="button" id="baixar">
                Baixar QR Code
            </button>
        </section>
    </main>

    <!-- Biblioteca para gerar QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Nosso JavaScript -->
    <script src="/script.js"></script>

</body>
</html>
